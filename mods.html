<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="mascot.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модификации — NoName Projects</title>
    
    <!-- Подключение Supabase JS -->
    <script src="vendor/supabase.min.js" defer></script><script src="vendor/email.min.js" defer></script>
    
    <!-- Подключение общих стилей -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Дополнительные стили для страницы модов -->
    <style>
        /* Страница модов – тёмно-фиолетовый неон */
        .mods-page main {
            padding-top: 2rem;
        }
        .mods-page h1 {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }

        .mods-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
            margin-bottom: 50px;
        }

        .mod-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            background-color: rgba(20, 15, 40, 0.6);
            border: 1px solid rgba(124, 58, 237, 0.4);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
        }

        .mod-card .mod-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            opacity: 0.25;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .mod-card .mod-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 1.5rem;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            transition: background 0.3s ease;
        }

        .mod-card .mod-content h2 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
            letter-spacing: 1px;
        }

        .mod-card .mod-content p {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 0.5rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Hover эффекты */
        .mod-card:hover {
            transform: scale(1.05);
            border-color: #a78bfa;
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
        }

        .mod-card:hover .mod-bg {
            opacity: 0.4;
        }

        .mod-card:hover .mod-content {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Адаптив */
        @media (max-width: 640px) {
            .mods-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                max-width: 400px;
            }
            .mod-card .mod-content h2 {
                font-size: 1.6rem;
            }
        }
        /* Принудительно включаем видимость страницы и отменяем прозрачность */
            body.mods-page {
                opacity: 1 !important;
        }


        /* ===== ФИКС: белый текст на карточках игр (читаемость в любой теме) ===== */
        .mod-card .mod-content { background: rgba(0,0,0,0.45) !important; }
        .mod-card .mod-content h2 { color: #ffffff !important; text-shadow: 0 0 18px rgba(124,58,237,.7); }
        .mod-card .mod-content p { color: rgba(255,255,255,0.85) !important; opacity: 1 !important; }
        .mod-card { border-color: rgba(168,85,247,0.35) !important; }
        .mod-card:hover { border-color: #a78bfa !important; box-shadow: 0 0 34px rgba(168,85,247,0.35) !important; }

        /* обложки виднее + ровная подложка под текст */
        .mod-card .mod-bg { filter: blur(2px) !important; opacity: 0.55 !important; }
        .mod-card .mod-content { background: rgba(8,5,18,0.5) !important; }
    </style>
</head>
<body class="mods-page">

    <!-- ШАПКА В СТИЛЕ PWGOODSTORE -->
    <header>
        <div class="header-left">
            <a href="index.html" class="logo-link">
                <img src="mascot.png" alt="NoName" class="site-logo-img">

<div class="header-right">

</div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ (Все теги теперь закрыты корректно) -->
    <main>

            <!-- Карточка 4: My Winter Car -->
            <a href="mwc.html" class="mod-card">
                <div class="mod-bg" style="background-image: url('mod4.png');"></div>
                <div class="mod-content">

    <!-- ПОДКЛЮЧЕНИЕ ГЛАВНОГО СТРИПТА ХАБА -->
    <script src="app.js"></script><script src="anim.js" defer></script>

</html>
