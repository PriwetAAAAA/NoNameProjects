<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoName Chatter</title>
<link rel="icon" type="image/png" href="mascot.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<script src="app.js" defer></script>

<style>

/* ===== NoName Chatter � ���������� (legend design) ===== */
body.nnchat-page { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
body.nnchat-page header { flex-shrink: 0; }

@keyframes shellIn { from { opacity:0; transform: translateY(22px) scale(.97); } to { opacity:1; transform:none; } }
@keyframes msgIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
@keyframes modalIn { from { opacity:0; transform: translateY(18px) scale(.95); } to { opacity:1; transform:none; } }
@keyframes dotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.5); } 50% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } }

.chat-main { flex: 1; min-height: 0; display: flex; padding: 10px 40px 20px; gap: 12px; }

.chat-shell {
  position: relative;
  flex: 1; min-height: 0; width: 100%; max-width: 1000px; margin: 0 auto;
  display: flex; gap: 0;
  background: rgba(10,12,30,.62);
  border: 1px solid var(--border-color);
  border-radius: 22px; overflow: hidden;
  box-shadow: 0 0 44px rgba(77,124,255,.14);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  animation: shellIn .6s cubic-bezier(.2,.7,.2,1);
}
.chat-shell::before {
  content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
  background: radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(168,85,247,.95), rgba(77,124,255,.4) 45%, transparent 72%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events:none; opacity:0; transition: opacity .35s; z-index: 5;
}
.chat-shell:hover::before { opacity: 1; }
.chat-shell::after {
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(124,58,237,.14), transparent 65%);
  opacity:0; transition: opacity .35s; z-index: 0;
}
.chat-shell:hover::after { opacity: 1; }

.people, .chat-pane { position: relative; z-index: 1; }

.people {
  width: 250px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--border-color); background: rgba(5,6,15,.35);
}
.people-head {
  padding: 14px 16px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-muted);
}
.people-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.person {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: transparent; border: 1px solid transparent; border-radius: 11px;
  padding: 10px 12px; color: var(--text-primary); font-size: 14px; cursor: pointer;
  font-family: inherit; transition: background .15s, border-color .15s, transform .15s;
}
.person:hover { background: rgba(255,255,255,.05); transform: translateX(3px); }
.person.active { background: rgba(77,124,255,.16); border-color: rgba(120,140,255,.35); }
.person .av {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg,#4d7cff,#a855f7); display: flex; align-items: center;
  justify-content: center; font-size: 13px; font-weight: 700; color: #fff;
  box-shadow: 0 2px 10px rgba(77,124,255,.35);
}
.person .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pending-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
  background: rgba(255,200,0,.08); border: 1px solid rgba(255,200,0,.25); font-size: 13px;
  animation: msgIn .3s ease both;
}
.pending-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ffd166; }
.pending-item button { width: 26px; height: 26px; border-radius: 7px; border: none; cursor: pointer; font-size: 14px; line-height: 1; color: #fff; transition: transform .12s; }
.pending-item button:active { transform: scale(.9); }
.pending-item .ok { background: #10b981; }
.pending-item .no { background: #ef4444; }
.add-friend-btn {
  margin: 8px; padding: 11px; border-radius: 11px; border: 1px dashed var(--border-color);
  background: transparent; color: var(--text-secondary); font-size: 13.5px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: border-color .2s, color .2s, background .2s;
}
.add-friend-btn:hover { border-color: var(--accent-end); color: var(--accent-end); background: rgba(168,85,247,.07); }

.chat-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-top {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--border-color);
}
.chat-top .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; flex-shrink: 0; }
.chat-top .dot.on { background: #10b981; box-shadow: 0 0 12px #10b981; animation: dotPulse 2s ease-in-out infinite; }
.chat-top h2 { font-size: 15px; font-weight: 700; margin: 0; color: var(--text-primary); }
.chat-top .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.chat-msgs {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 18px; display: flex; flex-direction: column; gap: 10px;
}
.chat-msgs::-webkit-scrollbar { width: 6px; }
.chat-msgs::-webkit-scrollbar-thumb { background: rgba(120,140,255,.28); border-radius: 3px; }
.msg { max-width: 78%; display: flex; flex-direction: column; animation: msgIn .3s ease both; }
.msg.own { align-self: flex-end; align-items: flex-end; }
.msg.other { align-self: flex-start; align-items: flex-start; }
.msg .who { font-size: 11px; color: var(--text-muted); margin: 0 4px 3px; }
.msg .bubble {
  padding: 10px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.45;
  word-break: break-word; white-space: pre-wrap; transition: transform .15s;
}
.msg.other .bubble { background: rgba(255,255,255,.055); border: 1px solid var(--border-color); border-bottom-left-radius: 5px; }
.msg.own .bubble { background: linear-gradient(135deg,#4d7cff,#a855f7); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 4px 18px rgba(124,58,237,.32); }
.msg .bubble:hover { transform: scale(1.01); }
.chat-empty { margin: auto; text-align: center; color: var(--text-muted); font-size: 14px; padding: 30px; }

.chat-input-bar {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px;
  border-top: 1px solid var(--border-color);
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}
.chat-input-bar input {
  flex: 1; min-height: 46px; padding: 0 16px; border-radius: 13px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border-color);
  color: var(--text-primary); font-size: 15px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.chat-input-bar input:focus { border-color: var(--accent-end); box-shadow: 0 0 0 3px rgba(168,85,247,.15); }
.chat-input-bar button {
  min-height: 46px; padding: 0 20px; border-radius: 13px; border: none; cursor: pointer;
  background: linear-gradient(135deg,#4d7cff,#a855f7); color: #fff; font-weight: 700;
  font-size: 15px; flex-shrink: 0; box-shadow: 0 4px 18px rgba(124,58,237,.32);
  transition: transform .12s, box-shadow .25s;
}
.chat-input-bar button:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(124,58,237,.5); }
.chat-input-bar button:active { transform: scale(.97); }

.people-toggle { display: none; }
@media (max-width: 820px) {
  .chat-main { padding: 6px 8px 8px; }
  .chat-shell { border-radius: 16px; }
  .people {
    position: fixed; left: 0; top: 0; bottom: 0; width: 78vw; max-width: 300px; z-index: 60;
    transform: translateX(-100%); transition: transform .25s ease;
    background: #0b0d18; border-right: 1px solid var(--border-color);
    box-shadow: 4px 0 30px rgba(0,0,0,.5);
    padding-top: env(safe-area-inset-top);
  }
  body.people-open .people { transform: translateX(0); }
  .people-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 59; opacity: 0;
    pointer-events: none; transition: opacity .25s;
  }
  body.people-open .people-backdrop { opacity: 1; pointer-events: auto; }
  .people-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border-color);
    background: transparent; color: var(--text-primary); font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .chat-top { padding: 11px 14px; }
  .chat-msgs { padding: 12px; gap: 8px; }
  .msg { max-width: 86%; }
}

.nl-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 120; background: rgba(0,0,0,.6); padding: 20px; }
.nl-modal.show { display: flex; }
.nl-card {
  width: 100%; max-width: 380px; background: #0c0e1c; border: 1px solid var(--border-color);
  border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  animation: modalIn .32s cubic-bezier(.2,.7,.2,1);
}
.nl-card h3 { margin: 0 0 6px; font-size: 17px; color: var(--text-primary); }
.nl-card p { margin: 0 0 14px; font-size: 13px; color: var(--text-muted); }
.nl-card input {
  width: 100%; min-height: 44px; padding: 0 14px; border-radius: 11px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border-color);
  color: var(--text-primary); font-size: 15px; outline: none; margin-bottom: 10px;
  transition: border-color .2s, box-shadow .2s;
}
.nl-card input:focus { border-color: var(--accent-end); box-shadow: 0 0 0 3px rgba(168,85,247,.15); }
.nl-card .row { display: flex; gap: 8px; }
.nl-card .row input { margin-bottom: 0; }
.nl-card button.primary {
  flex: 1; min-height: 44px; border-radius: 11px; border: none; cursor: pointer;
  background: linear-gradient(135deg,#4d7cff,#a855f7); color: #fff; font-weight: 700; font-size: 14.5px;
  transition: transform .12s, box-shadow .25s;
}
.nl-card button.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(124,58,237,.45); }
.nl-card button.ghost {
  min-height: 44px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--border-color);
  background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 14px;
  transition: border-color .2s, color .2s;
}
.nl-card button.ghost:hover { border-color: var(--accent-end); color: var(--accent-end); }
.nl-card .close { margin-top: 12px; text-align: center; }
.nl-card .close a { color: var(--text-muted); font-size: 13px; cursor: pointer; transition: color .2s; }
.nl-card .close a:hover { color: var(--text-primary); }
.nl-card .note { font-size: 12px; color: #ffd166; margin-top: 10px; }
.gear {
  margin-left: auto; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border-color);
  background: transparent; color: var(--text-secondary); font-size: 16px; cursor: pointer; flex-shrink: 0;
  transition: border-color .2s, color .2s, transform .15s;
}
.gear:hover { border-color: var(--accent-end); color: var(--accent-end); transform: rotate(8deg); }
</style>
</head>
<body class="nnchat-page">

    <header>
        <div class="header-left">
            <a href="index.html" class="logo-link">
                <img src="mascot.png" alt="NoName" class="site-logo-img">
                <span class="logo-text">NoName Projects</span>
            </a>
        </div>
        <div class="header-center">
            <a href="projects.html" class="nav-link">Проекты</a>
        </div>
        <div class="header-right">
            <button id="theme-toggle">Тема</button>
            <button id="login-btn" class="nav-link-btn">Войти</button>
            <div id="profile-btn" class="nav-link-btn" style="display: none; cursor: pointer; align-items: center;"></div>
        </div>
    </header>

    <main class="chat-main">
        <div class="chat-shell">
            <aside class="people">
                <div class="people-head">Люди</div>
                <div class="people-list" id="peopleList"></div>
                <button class="add-friend-btn" id="addFriendBtn">+ Добавить друга</button>
            </aside>
            <div class="people-backdrop" id="peopleBackdrop"></div>

            <section class="chat-pane">
                <div class="chat-top">
                    <button class="people-toggle" id="peopleToggle">�?�</button>
                    <span class="dot" id="connDot"></span>
                    <div>
                        <h2 id="chatTitle">Общий чат</h2>
                        <div class="sub" id="connText">Подключение...</div>
                    </div>
                    <button class="gear" id="mailBtn" title="Привязать почту">✉</button>
                </div>
                <div class="chat-msgs" id="msgs">
                    <div class="chat-empty" id="empty">Пока сообщений нет. Напиши первым!</div>
                </div>
                <div class="chat-input-bar">
                    <input id="msgInput" type="text" placeholder="Сообщение..." autocomplete="off" enterkeyhint="send" maxlength="2000">
                    <button id="sendBtn">Отправить</button>
                </div>
            </section>
        </div>
    </main>

    <!-- модалка добавления друга -->
    <div class="nl-modal" id="addModal">
        <div class="nl-card">
            <h3>Добавить друга</h3>
            <p>Введи ник друга. Ему придёт приглашение — как только примет, появится чат.</p>
            <input id="friendName" type="text" placeholder="Ник друга" autocomplete="off">
            <button class="primary" id="addFriendOk" style="width:100%">Отправить приглашение</button>
            <div class="close"><a id="addCancel">Отмена</a></div>
        </div>
    </div>

    <!-- модалка почты -->
    <div class="nl-modal" id="mailModal">
        <div class="nl-card">
            <h3>Привязать почту</h3>
            <p>На почту придёт 4-значный код. Он нужен, чтобы на неё шли рассылки от NoName.</p>
            <input id="mailEmail" type="email" placeholder="you@example.com" autocomplete="off">
            <div class="row">
                <button class="ghost" id="mailSendCode">Отправить код</button>
                <button class="primary" id="mailConfirm">Подтвердить</button>
            </div>
            <input id="mailCode" type="text" inputmode="numeric" maxlength="4" placeholder="4-значный код" style="margin-top:10px;text-align:center;letter-spacing:8px;font-size:20px">
            <div class="note" id="mailNote"></div>
            <div class="close"><a id="mailCancel">Закрыть</a></div>
        </div>
    </div>

<script>
(function () {
    var SB_URL = "https://phqorijqnkngxbvsyqli.supabase.co";
    var SB_KEY = "sb_publishable_8WhmMVAwFrADpdKq-Dv9Vw_zhBXi3PC";

    var $ = function (id) { return document.getElementById(id); };
    var msgs = $('msgs'), empty = $('empty'), input = $('msgInput'), sendBtn = $('sendBtn');
    var connDot = $('connDot'), connText = $('connText'), chatTitle = $('chatTitle');
    var peopleList = $('peopleList');

    var sb = null, myId = '', myName = 'Гость';
    var current = 'global';
    var friends = [];
    var pending = [];
    var seen = {};
    var channel = null;

    function setConn(ok, text) {
        connDot.className = 'dot' + (ok ? ' on' : '');
        connText.textContent = text;
    }

    function readMe() {
        try {
            var raw = localStorage.getItem('steam_user');
            if (raw) {
                var u = JSON.parse(raw);
                myId = (u && (u.id || u.name)) || '';
                myName = (u && (u.name || u.id)) || 'Гость';
            }
        } catch (_) {}
        if (!myId) myId = 'guest_' + Math.random().toString(36).slice(2, 8);
    }

    // retry-обёртка: переживает «Failed to fetch» (характерно для спящего проекта Supabase)
    function q(fn, tries) {
        tries = tries || 2;
        function attempt(n) {
            return Promise.resolve().then(fn).then(function (res) {
                if (res && res.error) throw res.error;
                return res;
            }).catch(function (e) {
                if (n >= tries) throw e;
                return new Promise(function (r) { setTimeout(r, 700 * (n + 1)); }).then(function () { return attempt(n + 1); });
            });
        }
        return attempt(0);
    }

    function convKey(otherId) {
        var arr = [myId, otherId].sort();
        return arr[0] + '|' + arr[1];
    }

    function clearMsgs() {
        msgs.innerHTML = '';
        seen = {};
    }

    function addMessage(m) {
        if (!m || !m.content) return;
        var key = m.id != null ? ('id:' + m.id) : ('t:' + (m.created_at || '') + '|' + (m.sender_id || '') + '|' + m.content);
        if (seen[key]) return;
        seen[key] = 1;
        var mine = (m.sender_id || '') === myId || (m.sender_name || '') === myName;
        var wrap = document.createElement('div');
        wrap.className = 'msg ' + (mine ? 'own' : 'other');
        var who = document.createElement('div');
        who.className = 'who';
        who.textContent = mine ? 'Вы' : (m.sender_name || m.sender_id || '�?грок');
        var b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = m.content;
        wrap.appendChild(who); wrap.appendChild(b);
        msgs.appendChild(wrap);
        while (msgs.children.length > 300) msgs.removeChild(msgs.firstChild);
    }

    function scrollBottom() { msgs.scrollTop = msgs.scrollHeight; }

    // ---------- СП�?СОК ЛЮДЕЙ ----------
    function renderPeople() {
        peopleList.innerHTML = '';

        var g = document.createElement('button');
        g.className = 'person' + (current === 'global' ? ' active' : '');
        g.innerHTML = '<span class="av">#</span><span class="nm">Общий чат</span>';
        g.onclick = function () { openConv('global', 'Общий чат'); };
        peopleList.appendChild(g);

        friends.forEach(function (f) {
            var b = document.createElement('button');
            b.className = 'person' + (current === convKey(f.id) ? ' active' : '');
            b.innerHTML = '<span class="av">' + (f.name || '?').charAt(0).toUpperCase() + '</span><span class="nm"></span>';
            b.querySelector('.nm').textContent = f.name || f.id;
            b.onclick = function () { openConv(convKey(f.id), f.name || f.id); };
            peopleList.appendChild(b);
        });

        pending.forEach(function (p) {
            var d = document.createElement('div');
            d.className = 'pending-item';
            d.innerHTML = '<span class="nm"></span><button class="ok">✓</button><button class="no">✗</button>';
            d.querySelector('.nm').textContent = p.from_name || p.from_id;
            d.querySelector('.ok').onclick = function () { acceptReq(p); };
            d.querySelector('.no').onclick = function () { rejectReq(p); };
            peopleList.appendChild(d);
        });

        if (!friends.length && !pending.length) {
            var e = document.createElement('div');
            e.className = 'chat-empty';
            e.style.fontSize = '12.5px';
            e.style.padding = '18px 8px';
            e.textContent = 'Друзей пока нет. Нажми «+ Добавить друга».';
            peopleList.appendChild(e);
        }
    }

    function loadFriends() {
        return q(function () {
            return sb.from('friendships').select('*').or('a_id.eq.' + myId + ',b_id.eq.' + myId);
        }).then(function (res) {
            friends = (res.data || []).map(function (f) {
                return {
                    id: f.a_id === myId ? f.b_id : f.a_id,
                    name: f.a_id === myId ? (f.b_name || f.b_id) : (f.a_name || f.a_id)
                };
            });
            renderPeople();
        }).catch(function () {});
    }

    function loadPending() {
        return q(function () {
            return sb.from('friend_requests').select('*').eq('to_id', myId).eq('status', 'pending');
        }).then(function (res) {
            pending = res.data || [];
            renderPeople();
        }).catch(function () {});
    }

    // ---------- ДРУЗЬЯ ----------
    function addFriend() {
        var name = $('friendName').value.trim();
        if (!name) return;
        $('friendName').value = '';
        closeModal('addModal');
        q(function () {
            return sb.from('friend_requests').insert([{ from_id: myId, from_name: myName, to_id: name, status: 'pending' }]);
        }).then(function () {
            alert('Приглашение отправлено для ' + name);
        }).catch(function (e) {
            alert('Ошибка: ' + (e.message || e));
        });
    }

    function acceptReq(p) {
        var a = [myId, p.from_id].sort();
        q(function () {
            return sb.from('friend_requests').update({ status: 'accepted' }).eq('id', p.id);
        }).then(function () {
            return q(function () {
                return sb.from('friendships').insert([{
                    a_id: a[0], b_id: a[1],
                    a_name: a[0] === myId ? myName : (p.from_name || p.from_id),
                    b_name: a[1] === myId ? myName : (p.from_name || p.from_id)
                }]);
            });
        }).then(function () {
            loadFriends(); loadPending();
        }).catch(function (e) { alert('Ошибка: ' + (e.message || e)); });
    }

    function rejectReq(p) {
        q(function () {
            return sb.from('friend_requests').update({ status: 'rejected' }).eq('id', p.id);
        }).then(function () { loadPending(); }).catch(function () {});
    }

    // ---------- ЧАТ ----------
    function openConv(key, title) {
        current = key;
        chatTitle.textContent = title;
        clearMsgs();
        document.body.classList.remove('people-open');
        if (channel) { try { channel.unsubscribe(); } catch (_) {} channel = null; }
        renderPeople();

        if (key === 'global') {
            subscribeGlobal();
            loadGlobal();
        } else {
            subscribeDm(key);
            loadDm(key);
        }
    }

    function loadGlobal() {
        q(function () {
            return sb.from('messages').select('*').order('created_at', { ascending: true }).limit(200);
        }).then(function (res) {
            (res.data || []).forEach(addMessage);
            if (!msgs.children.length) showEmpty();
            scrollBottom();
        }).catch(function (e) {
            setConn(false, 'Ошибка загрузки: ' + (e.message || 'Failed to fetch') + ' — проверь, работает ли Supabase');
        });
    }

    function loadDm(conv) {
        q(function () {
            return sb.from('dm_messages').select('*').eq('conv', conv).order('created_at', { ascending: true }).limit(200);
        }).then(function (res) {
            (res.data || []).forEach(addMessage);
            if (!msgs.children.length) showEmpty();
            scrollBottom();
        }).catch(function () {});
    }

    function showEmpty() {
        var e = document.createElement('div');
        e.className = 'chat-empty';
        e.textContent = 'Пока сообщений нет. Напиши первым!';
        msgs.appendChild(e);
    }

    function subscribeGlobal() {
        channel = sb.channel('nnchat_g_' + Date.now())
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
                function (p) { addMessage(p.new); scrollBottom(); })
            .subscribe(function (s) {
                if (s === 'SUBSCRIBED') setConn(true, 'На связи ● общий чат');
                else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setConn(false, 'Нет связи...');
            });
    }

    function subscribeDm(conv) {
        channel = sb.channel('nnchat_d_' + Date.now())
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_messages', filter: 'conv=eq.' + conv },
                function (p) { addMessage(p.new); scrollBottom(); })
            .subscribe(function (s) {
                if (s === 'SUBSCRIBED') setConn(true, 'На связи');
                else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setConn(false, 'Нет связи...');
            });
    }

    function send() {
        var text = input.value.trim();
        if (!text || !sb) return;
        input.value = '';
        var req;
        if (current === 'global') {
            req = sb.from('messages').insert([{ content: text, sender_id: myName }]);
        } else {
            req = sb.from('dm_messages').insert([{ conv: current, sender_id: myId, sender_name: myName, content: text }]);
        }
        q(function () { return req; }).catch(function (e) {
            setConn(false, 'Ошибка отправки: ' + (e.message || e));
            input.value = text;
        });
    }

    // ---------- ПОЧТА (4-значный код) ----------
    var pendingCode = null;

    // ⚠️ EmailJS: вставь свои ключи с https://dashboard.emailjs.com
    //   Account → General → Public Key
    //   Email Services → твой сервис (Service ID)
    //   Email Templates → твой шаблон (Template ID), в шаблоне используй {{to_email}} и {{code}}
    var EMAILJS = {
        publicKey: "1QglDVAtlSla_-OVR",
        serviceId: "service_x4j5klc",
        templateId: "template_mgnt92q"
    };

    function openModal(id) { $(id).classList.add('show'); }
    function closeModal(id) { $(id).classList.remove('show'); }

    function sendMailCode() {
        var email = $('mailEmail').value.trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
            $('mailNote').textContent = 'Введи корректную почту';
            return;
        }
        var code = String(Math.floor(1000 + Math.random() * 9000));
        pendingCode = { email: email, code: code };

        function store() {
            q(function () {
                var exp = new Date(Date.now() + 10 * 60 * 1000).toISOString();
                return sb.from('email_codes').insert([{ owner_id: myId, email: email, code: code, purpose: 'link', expires_at: exp }]);
            }).catch(function () {});
        }

        var configured = EMAILJS.publicKey && EMAILJS.serviceId && EMAILJS.templateId && window.emailjs;
        if (configured) {
            $('mailNote').textContent = 'Отправляю код на ' + email + '...';
            window.emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {
                to_email: email, code: code, passcode: code, otp: code,
                time: new Date(Date.now() + 10 * 60 * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
            })
                .then(function () {
                    store();
                    $('mailNote').textContent = 'Код отправлен на ' + email + ' — проверь почту';
                })
                .catch(function (e) {
                    store();
                    $('mailNote').textContent = 'Письмо не ушло: ' + ((e && (e.text || e.message)) || e) + ' (код: ' + code + ')';
                });
        } else {
            store();
            $('mailNote').textContent = 'Демо: код ' + code + ' (впиши ключи EmailJS в nnchat.html, чтобы слать на почту)';
        }
    }

    function confirmMail() {
        var code = $('mailCode').value.trim();
        if (!pendingCode) { $('mailNote').textContent = 'Сначала отправь код'; return; }
        if (code !== pendingCode.code) { $('mailNote').textContent = 'Неверный код'; return; }
        q(function () {
            return sb.from('email_codes').update({ used: true }).eq('email', pendingCode.email).eq('code', code);
        }).then(function () {
            $('mailNote').textContent = 'Почта привязана: ' + pendingCode.email;
            pendingCode = null;
        }).catch(function (e) { $('mailNote').textContent = 'Ошибка: ' + (e.message || e); });
    }

    // ---------- �?Н�?Ц�?АЛ�?ЗАЦ�?Я ----------
    function initCursorGlow() {
        var shell = document.querySelector('.chat-shell');
        if (!shell) return;
        shell.addEventListener('mousemove', function (e) {
            var r = shell.getBoundingClientRect();
            shell.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            shell.style.setProperty('--my', (e.clientY - r.top) + 'px');
        });
    }

    function boot() {
        if (!window.supabase) { setTimeout(boot, 120); return; }
        readMe();
        sb = window.supabase.createClient(SB_URL, SB_KEY);
        if (window.emailjs && EMAILJS.publicKey) {
            try { window.emailjs.init({ publicKey: EMAILJS.publicKey }); } catch (_) {}
        }

        // подписка на входящие приглашения (реальное время)
        sb.channel('nnchat_fr_' + Date.now())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'friend_requests' },
                function (p) {
                    var r = p.new || p.old;
                    if (r && r.to_id === myId) { loadPending(); }
                })
            .subscribe();

        loadFriends();
        loadPending();
        openConv('global', 'Общий чат');

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        $('addFriendBtn').onclick = function () { openModal('addModal'); };
        $('addCancel').onclick = function () { closeModal('addModal'); };
        $('addFriendOk').onclick = addFriend;

        $('mailBtn').onclick = function () { openModal('mailModal'); };
        $('mailCancel').onclick = function () { closeModal('mailModal'); };
        $('mailSendCode').onclick = sendMailCode;
        $('mailConfirm').onclick = confirmMail;

        $('peopleToggle').onclick = function () { document.body.classList.toggle('people-open'); };
        $('peopleBackdrop').onclick = function () { document.body.classList.remove('people-open'); };

        initCursorGlow();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
})();
</script>
</body>
</html>
