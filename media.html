<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скачать медиа — NoName</title>
<link rel="icon" href="mascot.png">
<style>
:root{
  --brand:#7ec8ff; --brand2:#a78bfa;
  --g1:#0a0a1f; --g2:#05060f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#e8ecff;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 8%, color-mix(in srgb, var(--brand) 32%, transparent), transparent 45%),
    radial-gradient(circle at 85% 12%, color-mix(in srgb, var(--brand2) 26%, transparent), transparent 48%),
    linear-gradient(160deg, var(--g1), var(--g2) 70%);
  background-attachment:fixed;
  transition:background .6s ease;
}
nav{display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;padding:16px 18px;position:relative;z-index:2}
nav a{color:#9fb0e8;text-decoration:none;font-weight:700;font-size:14px}
nav a:hover{color:#fff}
.brand{color:#fff;font-weight:900}
main{max-width:900px;margin:0 auto;padding:10px 18px 90px;position:relative;z-index:2}

.hero{text-align:center;padding:24px 0 18px;transition:.4s}
.svc{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;margin-bottom:16px;
  background:color-mix(in srgb, var(--brand) 18%, transparent);
  border:1.5px solid color-mix(in srgb, var(--brand) 55%, transparent);
  font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  transition:.4s}
.svc i{font-style:normal;font-size:16px;line-height:1}
h1{font-size:clamp(30px,6.5vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1;
  background:linear-gradient(90deg, var(--brand), var(--brand2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px color-mix(in srgb, var(--brand) 45%, transparent));
  transition:.4s}
.sub{color:#9aa8d8;font-size:14px;margin-top:12px;line-height:1.6}

.box{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 12px}
.box input{flex:1;min-width:220px;font:inherit;font-size:15px;padding:15px 18px;border-radius:14px;
  border:2px solid color-mix(in srgb, var(--brand) 45%, transparent);
  background:rgba(10,10,26,.75);color:#fff;outline:none;transition:.2s;backdrop-filter:blur(8px)}
.box input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent)}
.box button{font:inherit;font-size:15px;font-weight:800;padding:15px 26px;border-radius:14px;cursor:pointer;border:none;
  background:linear-gradient(135deg, var(--brand), var(--brand2));color:#04030f;
  box-shadow:0 8px 24px color-mix(in srgb, var(--brand) 35%, transparent);transition:.15s}
.box button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.box button:disabled{opacity:.5;cursor:wait;transform:none}

.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#9aa8d8;margin-bottom:8px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input,.opts select{font:inherit;font-size:13px;padding:8px 11px;border-radius:10px;
  border:1px solid color-mix(in srgb, var(--brand) 35%, transparent);
  background:rgba(10,10,26,.8);color:#dfe6ff;outline:none}

.status{text-align:center;font-size:13px;font-weight:700;min-height:20px;margin:14px 0;
  color:var(--brand);transition:.3s}
.status.err{color:#ff6b81}

.card{display:none;gap:18px;padding:18px;border-radius:18px;background:rgba(12,12,30,.8);
  border:1.5px solid color-mix(in srgb, var(--brand) 35%, transparent);
  backdrop-filter:blur(12px);margin-bottom:18px;
  box-shadow:0 16px 50px color-mix(in srgb, var(--brand) 16%, transparent);
  transition:.4s}
.card.show{display:flex}
.card img{width:200px;border-radius:12px;flex-shrink:0;object-fit:cover;background:#000}
.card .meta{flex:1;min-width:0}
.card h3{font-size:17px;margin-bottom:8px;word-break:break-word;line-height:1.35}
.card p{font-size:13px;color:#9aa8d8;margin-bottom:4px}
.formats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fmt{font:inherit;font-size:13px;font-weight:700;padding:10px 15px;border-radius:11px;cursor:pointer;
  border:1.5px solid color-mix(in srgb, var(--brand) 45%, transparent);
  background:rgba(20,20,46,.9);color:#dfe6ff;transition:.15s}
.fmt:hover{border-color:var(--brand);color:#fff;transform:translateY(-2px)}
.fmt.audio{border-color:rgba(255,214,0,.5);color:#ffe680}
.fmt.audio:hover{border-color:#ffe600}

.hint{text-align:center;color:#6f7aab;font-size:12px;margin-top:34px;line-height:1.8}
.hint b{color:#9aa8d8}
@media(max-width:560px){
  .card{flex-direction:column}
  .card img{width:100%;height:180px}
  h1{letter-spacing:-.5px}
}
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html">NoName</a>
  <a href="programs.html">← приложения</a>
</nav>

<main>
  <div class="hero">
    <div class="svc" id="svc"><i id="svcIcon">🌐</i><span id="svcName">любой сервис</span></div>
    <h1>СКАЧАТЬ МЕДИА</h1>
    <p class="sub" id="sub">Вставь ссылку — страница перекрасится под сервис и покажет доступные форматы.</p>
  </div>

  <div class="box">
    <input id="url" type="text" placeholder="https://youtube.com/watch?v=...  или  https://tiktok.com/...">
    <button id="check">Проверить</button>
  </div>

  <div class="opts">
    <label>Сервер: <input id="srv" type="text" style="width:200px"></label>
    <label>Качество:
      <select id="q">
        <option value="best">Лучшее</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="audio">Только звук (mp3)</option>
      </select>
    </label>
  </div>

  <div class="status" id="status"></div>

  <div class="card" id="card">
    <img id="thumb" alt="">
    <div class="meta">
      <h3 id="title"></h3>
      <p id="dur"></p>
      <p id="src"></p>
      <div class="formats" id="fmts"></div>
    </div>
  </div>

  <p class="hint">Скачивание работает через локальный сервер (yt-dlp).<br>Запусти <b>media-server</b> на ПК и укажи его адрес выше.</p>
</main>

<script>
(function () {
    var SERVICES = {
        youtube:    { n: 'YouTube',       b: '#ff0033', b2: '#ff6b6b', g1: '#1c0006', g2: '#080002', i: '▶' },
        tiktok:     { n: 'TikTok',        b: '#00f2ea', b2: '#ff0050', g1: '#001518', g2: '#08000a', i: '♪' },
        instagram:  { n: 'Instagram',     b: '#e1306c', b2: '#f77737', g1: '#1c0014', g2: '#0a0208', i: '◉' },
        twitter:    { n: 'X / Twitter',   b: '#5aa9ff', b2: '#c9d9ff', g1: '#00101c', g2: '#000000', i: '𝕏' },
        vk:         { n: 'VK Видео',      b: '#0077ff', b2: '#66aaff', g1: '#000d22', g2: '#000004', i: 'VK' },
        ok:         { n: 'OK.ru',         b: '#ff7f00', b2: '#ffc266', g1: '#1c0f00', g2: '#080500', i: 'OK' },
        rutube:     { n: 'Rutube',        b: '#00c853', b2: '#8dffb9', g1: '#001c0d', g2: '#000805', i: 'R' },
        dzen:       { n: 'Dzen',          b: '#ff6b00', b2: '#ffb066', g1: '#1c0b00', g2: '#080400', i: 'D' },
        twitch:     { n: 'Twitch',        b: '#9146ff', b2: '#c9a6ff', g1: '#100022', g2: '#04000a', i: '▸' },
        reddit:     { n: 'Reddit',        b: '#ff4500', b2: '#ff9a66', g1: '#1c0900', g2: '#080300', i: 'r' },
        pinterest:  { n: 'Pinterest',     b: '#e60023', b2: '#ff7090', g1: '#1c0008', g2: '#080002', i: 'P' },
        facebook:   { n: 'Facebook',      b: '#1877f2', b2: '#8fbaff', g1: '#001228', g2: '#000005', i: 'f' },
        soundcloud: { n: 'SoundCloud',    b: '#ff7700', b2: '#ffc266', g1: '#1c0e00', g2: '#080400', i: '☁' },
        boosty:     { n: 'Boosty',        b: '#ff5a00', b2: '#ffa366', g1: '#1c0900', g2: '#080300', i: 'B' }
    };

    var urlEl = document.getElementById('url');
    var srvEl = document.getElementById('srv');
    var qEl = document.getElementById('q');
    var checkBtn = document.getElementById('check');
    var statusEl = document.getElementById('status');
    var card = document.getElementById('card');
    var thumb = document.getElementById('thumb');
    var titleEl = document.getElementById('title');
    var durEl = document.getElementById('dur');
    var srcEl = document.getElementById('src');
    var fmts = document.getElementById('fmts');
    var svc = document.getElementById('svc');
    var svcIcon = document.getElementById('svcIcon');
    var svcName = document.getElementById('svcName');
    var subEl = document.getElementById('sub');

    var DEFAULT = { n: 'любой сервис', b: '#7ec8ff', b2: '#a78bfa', g1: '#0a0a1f', g2: '#05060f', i: '🌐' };
    var currentSvc = DEFAULT;

    srvEl.value = localStorage.getItem('nn_media_srv') || 'http://localhost:8088';
    srvEl.onchange = function () { localStorage.setItem('nn_media_srv', srvEl.value); };

    function srv() { return srvEl.value.replace(/\/+$/, ''); }
    function setStatus(s, isErr) {
        statusEl.textContent = s || '';
        statusEl.className = 'status' + (isErr ? ' err' : '');
    }
    function fmtTime(t) {
        if (!t) return '';
        t = Math.round(t);
        return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
    }

    function detectSvc(u) {
        var h = '';
        try { h = new URL(u).hostname.toLowerCase(); } catch (_) { return null; }
        if (/youtube\.com|youtu\.be/.test(h)) return SERVICES.youtube;
        if (/tiktok\.com/.test(h)) return SERVICES.tiktok;
        if (/instagram\.com/.test(h)) return SERVICES.instagram;
        if (/twitter\.com|x\.com/.test(h)) return SERVICES.twitter;
        if (/vk\.com|vkvideo\.ru/.test(h)) return SERVICES.vk;
        if (/ok\.ru/.test(h)) return SERVICES.ok;
        if (/rutube\.ru/.test(h)) return SERVICES.rutube;
        if (/dzen\.ru/.test(h)) return SERVICES.dzen;
        if (/twitch\.tv/.test(h)) return SERVICES.twitch;
        if (/reddit\.com|redd\.it/.test(h)) return SERVICES.reddit;
        if (/pinterest\./.test(h)) return SERVICES.pinterest;
        if (/facebook\.com|fb\.watch/.test(h)) return SERVICES.facebook;
        if (/soundcloud\.com/.test(h)) return SERVICES.soundcloud;
        if (/boosty\.to/.test(h)) return SERVICES.boosty;
        return null;
    }

    function applyTheme(s) {
        if (!s) s = DEFAULT;
        currentSvc = s;
        var r = document.documentElement.style;
        r.setProperty('--brand', s.b);
        r.setProperty('--brand2', s.b2);
        r.setProperty('--g1', s.g1);
        r.setProperty('--g2', s.g2);
        svcIcon.textContent = s.i;
        svcName.textContent = s.n;
    }

    // следим за вводом — перекрашиваем на лету
    var deb = null;
    urlEl.addEventListener('input', function () {
        clearTimeout(deb);
        deb = setTimeout(function () {
            var s = detectSvc(urlEl.value.trim());
            if (s) applyTheme(s);
            else if (!urlEl.value.trim()) applyTheme(null);
        }, 180);
    });

    checkBtn.onclick = function () {
        var u = urlEl.value.trim();
        if (!u) { setStatus('Вставь ссылку', true); return; }
        var s = detectSvc(u);
        if (s) applyTheme(s);
        card.classList.remove('show');
        checkBtn.disabled = true;
        setStatus('Проверяю…');
        fetch(srv() + '/api/info?url=' + encodeURIComponent(u))
            .then(function (r) {
                if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || ('HTTP ' + r.status)); });
                return r.json();
            })
            .then(function (d) {
                thumb.src = d.thumbnail || '';
                titleEl.textContent = d.title || '—';
                durEl.textContent = d.duration ? ('Длительность: ' + fmtTime(d.duration)) : '';
                srcEl.textContent = (d.uploader ? (d.uploader + ' · ') : '') + (d.extractor || '');
                fmts.innerHTML = '';
                var list = (d.formats && d.formats.length) ? d.formats : [{ id: 'best', label: 'Лучшее' }];
                list.forEach(function (f) {
                    var b = document.createElement('button');
                    b.className = 'fmt' + (f.audio ? ' audio' : '');
                    b.textContent = f.label;
                    b.onclick = function () { download(f.id, b); };
                    fmts.appendChild(b);
                });
                card.classList.add('show');
                setStatus('Готово. Выбери формат.');
            })
            .catch(function (e) {
                var msg = String(e.message || e);
                if (msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('NetworkError') >= 0) {
                    setStatus('Сервер не запущен. Запусти media-server на ПК (run.bat) и проверь адрес.', true);
                } else {
                    setStatus('Ошибка: ' + msg, true);
                }
            })
            .finally(function () { checkBtn.disabled = false; });
    };

    function download(fmtId, btn) {
        var u = urlEl.value.trim();
        if (!u) return;
        btn.disabled = true;
        setStatus('Скачиваю… это может занять время');
        fetch(srv() + '/api/download?url=' + encodeURIComponent(u) + '&format=' + encodeURIComponent(fmtId) + '&quality=' + encodeURIComponent(qEl.value))
            .then(function (r) {
                if (!r.ok) throw new Error('сервер вернул ' + r.status);
                var cd = r.headers.get('Content-Disposition') || '';
                var name = 'media';
                var m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
                if (m) name = decodeURIComponent(m[1]);
                return r.blob().then(function (b) { return { blob: b, name: name }; });
            })
            .then(function (res) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(res.blob);
                a.download = res.name;
                document.body.appendChild(a);
                a.click();
                setTimeout(function () { a.remove(); URL.revokeObjectURL(a.href); }, 1500);
                setStatus('Скачано: ' + res.name);
            })
            .catch(function (e) { setStatus('Ошибка: ' + (e.message || e), true); })
            .finally(function () { btn.disabled = false; });
    }

    urlEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkBtn.click(); });

    applyTheme(null);
})();
</script>
</body>
</html>
